version: 5.0.0
source:
  repo: metroman
  github_username: SWOT-Confluence
  branch: main
  commit: 69e8a96e01c3e4064c8c0c6a828afc6fcb5c1406
  image_tag: metroman:latest
module:
  name: metroman
  produces:
  - filepath: flpe/metroman/{reach_id}_metroman.nc
    dimensions:
    - nt
    variables:
      nt:
        dtype: f8
        dimensions:
        - nt
        required: true
        attrs:
          long_name: swot timeseries "time" variable converted to hours and rounded
            to integer
      time_str:
        dtype: str
        dimensions:
        - nt
        required: true
        attrs:
          long_name: swot timeseries "time" variable.
      average/allq:
        dtype: f8
        dimensions:
        - nt
        required: true
        attrs:
          long_name: allq
      average/A0hat:
        dtype: f8
        dimensions: []
        required: true
        attrs:
          long_name: A0hat
      average/nahat:
        dtype: f8
        dimensions: []
        required: true
        attrs:
          long_name: nahat
      average/x1hat:
        dtype: f8
        dimensions: []
        required: true
        attrs:
          long_name: x1hat
      average/q_u:
        dtype: f8
        dimensions:
        - nt
        required: true
        attrs:
          long_name: q_u
      '{reach_set}/allq':
        dtype: f8
        dimensions:
        - nt
        required: true
        attrs:
          long_name: allq
      '{reach_set}/A0hat':
        dtype: f8
        dimensions: []
        required: true
        attrs:
          long_name: A0hat
      '{reach_set}/nahat':
        dtype: f8
        dimensions: []
        required: true
        attrs:
          long_name: nahat
      '{reach_set}/x1hat':
        dtype: f8
        dimensions: []
        required: true
        attrs:
          long_name: x1hat
      '{reach_set}/q_u':
        dtype: f8
        dimensions:
        - nt
        required: true
        attrs:
          long_name: q_u
  consumes: []
