# Contract for the Output module's aggregated SoS results file.
#
# SEEDED from a real result file, then hand-reviewed:
#   na_sword_v16_SOS_results_unconstrained_20230502T204408_20250502T204408_20251219T163700.nc
#   (NA continent, 38,048 reaches / 1,683,122 nodes, 212 variables, 15 groups)
#
# Variable keys are group-qualified (`group/var`, `group/subgroup/var`) to match the keys
# cit.netcdf.Netcdf._walk produces, so a flat mapping describes a grouped file.
#
# `dimensions` below lists ROOT dimensions only. cit.netcdf.Netcdf.dimensions() reads the
# root table, so declaring a group-local dimension here would be reported MISSING. The
# group-local ones still appear in per-variable `dimensions`, which are compared against
# the variable's own dimension names:
#   lakeflow: lakeflow_dates=689
#   postdiagnostics: nchar=10
#   postdiagnostics/basin: basin_num_algos=5
#   postdiagnostics/reach: reach_num_algos=6
#   sic4dvar: nb_pts=10
#   validation: num_algos=14, nchar=100, num_reaches=38048
#   NOTE: `validation` redeclares num_reaches, shadowing root at the same size.
#
# Only the reaches/ and nodes/ groups are `required`. Every module group is optional because
# group presence tracks the run's modules_to_run, not data availability -- a partial run
# legitimately omits whole groups.

version: "16.0"   # file reports SWORD v16; its `history` says Confluence version 0.1.0
