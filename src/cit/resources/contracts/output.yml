version: 5.0.0
source:
  repo: output
  github_username: SWOT-Confluence
  branch: main
  commit: 3b57ffe241c85b6da03ad886e31b2cfae10c52b2
  image_tag: output:latest
module:
  name: output
  produces:
  - filepath: output/sos/{continent_id}_sword_v{number}_SOS_results.nc
    dimensions:
    - num_reaches
    - num_nodes
    variables:
      reaches/reach_id:
        dtype: i8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: reach_identifier
          comment: 'Taken from SWORD PDD: id of each reach. The format of none the
            id is as follows: CBBBBBRRRRT where C = Continent (the first number of
            the Pfafstetter basin code), B = Remaining Pfafstetter basin codes up
            to level 6, R = Reach id (assigned sequentially within a level 6 basin
            starting at the downstream end working upstream, T = Type (1 – river,
            3 – lake on river, 4 – dam or waterfall, 5 – unreliable topology, 6 –
            ghost reach)'
          valid_min: -998.0
          valid_max: 1.0e+18
          coverage_content_type: referenceInformation
      reaches/x:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: longitude
          comment: longitude of the reach center decimal ranging from 180°E to 180°W
          units: degrees_east
          valid_min: -180.0
          valid_max: 180.0
          coverage_content_type: coordinate
      reaches/y:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: latitude
          comment: latitude of the reach center decimal ranging from 90°S to 90°N
          units: degrees_north
          valid_min: -90.0
          valid_max: 90.0
          coverage_content_type: coordinate
      reaches/river_name:
        dtype: str
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: river names
          comment: all river names associated with a reach. If there are multiple
            names for a reach they are listed in alphabetical order and separated
            by a semicolon.
          coverage_content_type: referenceInformation
      reaches/observations:
        dtype: str
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: cycle pass observations
          comment: Pass numbers associated with observations for each reach. Cycle
            passes are taken from shapefile name where a single cycle, pass combination
            is separated by an underscored (e.g., 112_386 representing cycle 112 and
            pass 386). Cycle, pass combinations are stored as strings with each cycle_pass
            element separated by a comma for each reach that has observations.
          units: pass
          valid_min: 1.0
          valid_max: 584.0
          coverage_content_type: coordinate
      reaches/time:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: time (UTC)
          comment: 'Taken from SWORD PDD: Time of measurement in seconds in the UTC
            time scale since 1 Jan 2000 00:00:00 UTC. [tai_utc_difference] is the
            difference between TAI and UTC reference time (seconds) for the first
            measurement of the data set. If a leap second occurs within the data set,
            the metadata leap_second is set to the UTC time at which the leap second
            occurs.'
          units: seconds since 2000-01-01 00:00:00.000
          valid_min: -998.0
          valid_max: 999999999999.0
          coverage_content_type: coordinate
      nodes/node_id:
        dtype: i8
        dimensions:
        - num_nodes
        required: true
        attrs:
          long_name: node_identifier
          comment: 'Taken from SWORD PDD: id of each node the high resolution centerline
            point is associated with. The format of the id is as follows: CBBBBBRRRRNNNT
            where

            C = Continent (the first number of the Pfafstetter basin code), B = Remaining
            Pfafstetter basin codes up to level 6, R = Reach id (assigned sequentially
            within a level 6 basin starting at the downstream end working upstream),
            N = Node id (assigned sequentially within a reach starting at the downstream
            end working upstream), T = Type (1 – river, 3 – lake on river, 4 – dam
            or waterfall, 5 – unreliable topology, 6 – ghost node)'
          valid_min: -998.0
          valid_max: 1.0e+18
          coverage_content_type: referenceInformation
      nodes/reach_id:
        dtype: i8
        dimensions:
        - num_nodes
        required: true
        attrs:
          long_name: reach_identifier
          comment: 'Taken from SWORD PDD: id of the reach each node is associated
            with. The format of the id is as follows: CBBBBBRRRRT where C = Continent
            (the first number of the Pfafstetter basin code), B = Remaining Pfafstetter
            basin codes up to level 6, R = Reach id (assigned sequentially within
            a level 6 basin starting at the downstream end working upstream), T =
            Type (1 – river, 3 – lake on river, 4 – dam or waterfall, 5 – unreliable
            topology, 6 – ghost reach)d'
          valid_min: -998.0
          valid_max: 1.0e+18
          coverage_content_type: referenceInformation
      nodes/x:
        dtype: f8
        dimensions:
        - num_nodes
        required: true
        attrs:
          long_name: longitude
          comment: longitude of each node ranging from 180°E to 180°W
          units: degrees_east
          valid_min: -180.0
          valid_max: 180.0
          coverage_content_type: coordinate
      nodes/y:
        dtype: f8
        dimensions:
        - num_nodes
        required: true
        attrs:
          long_name: latitude
          comment: latitude of each node ranging from 90°S to 90°N
          units: degrees_north
          valid_min: -90.0
          valid_max: 90.0
          coverage_content_type: coordinate
      nodes/river_name:
        dtype: str
        dimensions:
        - num_nodes
        required: true
        attrs:
          long_name: river names
          comment: all river names associated with a node. If there are multiple names
            for a node they are listed in alphabetical order and separated by a semicolon.
          coverage_content_type: referenceInformation
      nodes/observations:
        dtype: str
        dimensions:
        - num_nodes
        required: true
        attrs:
          long_name: cycle pass observations
          comment: Pass numbers associated with observations for each node. Cycle
            passes are taken from shapefile name where a single cycle, pass combination
            is separated by an underscored (e.g., 112_386 representing cycle 112 and
            pass 386). Cycle, pass combinations are stored as strings with each cycle_pass
            element separated by a comma for each node that has observations.
          units: pass
          valid_min: 1.0
          valid_max: 584.0
          coverage_content_type: coordinate
      nodes/time:
        dtype: f8
        dimensions:
        - num_nodes
        required: true
        attrs:
          long_name: time (UTC)
          comment: 'Taken from SWORD PDD: Time of measurement in seconds in the UTC
            time scale since 1 Jan 2000 00:00:00 UTC. [tai_utc_difference] is the
            difference between TAI and UTC reference time (seconds) for the first
            measurement of the data set. If a leap second occurs within the data set,
            the metadata leap_second is set to the UTC time at which the leap second
            occurs.'
          units: seconds since 2000-01-01 00:00:00.000
          valid_min: -998.0
          valid_max: 999999999999.0
          coverage_content_type: coordinate
      momma/stage:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: SWOT-observed reach-averaged water-surface elevation
          comment: Datum defined by SWOT
          units: m
          valid_min: -100.0
          valid_max: 10000.0
          coverage_content_type: modelResult
      momma/width:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: SWOT-observed reach-averaged river width
          comment: Reach surface water area divided by the reach length
          units: m
          valid_min: 0.0
          valid_max: 100000.0
          coverage_content_type: modelResult
      momma/slope:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: SWOT-observed reach water-surface slope
          comment: Upstream and downstream water-surface elevations divided by the
            reach length
          valid_min: 0.0
          valid_max: 0.1
          coverage_content_type: modelResult
      momma/Qgage:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Ground-gaged streamflow obs contemporaneous with SWOT obs
          comment: The ground gage is an independent discharge measuring point within
            the reach obtained from an existing streamgage network
          units: m^3/s
          valid_min: 0.0
          valid_max: 1000000.0
          coverage_content_type: modelResult
      momma/seg:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: A portion of the stage-width curve (relation)
          comment: seg = 1, below bankfull stage; seg = 2, equal to or above bankfull
            stage
          valid_min: 1.0
          valid_max: 2.0
          coverage_content_type: modelResult
      momma/n:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Manning flow resistance estimated for the reach
          comment: Represents the resistance to flow within the reach when using the
            Manning equation to describe the mean flow
          valid_min: 0.001
          valid_max: 0.3
          coverage_content_type: modelResult
      momma/Y:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Average water depth within the reach
          comment: Mean depth of flow in the reach excluding zones of zero flow and
            is not directly measured
          units: m
          valid_min: 0.0
          valid_max: 100.0
          coverage_content_type: modelResult
      momma/v:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Average velocity of flow within the reach
          comment: Computed from the mean depth, slope, and flow resistance; not measured
          units: m/s
          valid_min: 0.0
          valid_max: 10.0
          coverage_content_type: modelResult
      momma/Q:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: MOMMA-estimated discharge
          comment: For cases with complete SWOT-observed data (slope, width, elevation)
          units: m^3/s
          valid_min: 0.0
          valid_max: 1000000.0
          coverage_content_type: modelResult
      momma/Q_constrained:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: MOMMA-estimated discharges using Qgage values for calibration
          comment: For cases when Qgage values are available and gage_constrained
            == TRUE
          units: m^3/s
          valid_min: 0.0
          valid_max: 1000000.0
          coverage_content_type: modelResult
      momma/gage_constrained:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Boolean indicating presence of Qgage obs available for calibration
          comment: Set to TRUE if Qgage values are available for calibration
          valid_min: 0.0
          valid_max: 1.0
          coverage_content_type: modelResult
      momma/input_Qm_prior:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Prior estimated mean daily discharge for the reach
          comment: Prior calibration target contained and hosted in the SWORD database
          units: m^3/s
          valid_min: 0.0
          valid_max: 1000000.0
          coverage_content_type: modelResult
      momma/input_Qb_prior:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Prior estimated bankfull discharge for the reach
          comment: Prior calibration target contained and hosted in the SWORD database
          units: m^3/s
          valid_min: 0.0
          valid_max: 1000000.0
          coverage_content_type: modelResult
      momma/input_Yb_prior:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Prior estimated bankfull depth for the reach
          comment: Prior calibration target contained and hosted in the SWORD database
          units: m
          valid_min: 0.0
          valid_max: 100.0
          coverage_content_type: modelResult
      momma/input_known_ezf:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Prior elevation of zero flow (channel thalweg stage)
          comment: If known, a provided (prior) value of the bottom elevation of the
            reach channel relative to stage datum
          units: m
          valid_min: -100.0
          valid_max: 10000.0
          coverage_content_type: modelResult
      momma/input_known_bkfl_stage:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Prior elevation of bankfull stage
          comment: If known, a provided (prior) value of the bankfull stage of the
            reach channel relative to stage datum
          units: m
          valid_min: -100.0
          valid_max: 10000.0
          coverage_content_type: modelResult
      momma/input_known_nb_seg1:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Prior reach-average flow resistance for stages below bankfull
          comment: If known, a provided (prior) value of the base n-value below bankfull
          valid_min: 0.001
          valid_max: 0.3
          coverage_content_type: modelResult
      momma/input_known_x_seg1:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Prior reach-average flow resistance exponent for stages below
            bankfull
          comment: If known, a provided (prior) value of the resistance exponent below
            bankfull
          valid_min: -1.0
          valid_max: 2.0
          coverage_content_type: modelResult
      momma/Qgage_constrained_nb_seg1:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Reach-average flow resistance for stages below bankfull derived
            from calibration with Qgage data
          comment: Computed when gage_contrained == TRUE
          valid_min: 0.001
          valid_max: 0.3
          coverage_content_type: modelResult
      momma/Qgage_constrained_x_seg1:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Reach-average flow resistance exponent for stages below bankfull
            derived from calibration with Qgage data
          comment: Computed when gage_contrained == TRUE
          valid_min: -1.0
          valid_max: 2.0
          coverage_content_type: modelResult
      momma/input_known_nb_seg2:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Prior reach-average flow resistance for stages above bankfull
          comment: If known, a provided (prior) value of the base n-value above bankfull
          valid_min: 0.001
          valid_max: 0.3
          coverage_content_type: modelResult
      momma/input_known_x_seg2:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Prior reach-average flow resistance exponent for stages above
            bankfull
          comment: If known, a provided (prior) value of the resistance exponent above
            bankfull
          valid_min: -1.0
          valid_max: 2.0
          coverage_content_type: modelResult
      momma/Qgage_constrained_nb_seg2:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Reach-average flow resistance for stages above bankfull derived
            from calibration with Qgage data
          comment: Computed when gage_contrained == TRUE
          valid_min: 0.001
          valid_max: 0.3
          coverage_content_type: modelResult
      momma/Qgage_constrained_x_seg2:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Reach-average flow resistance exponent for stages above bankfull
            derived from calibration with Qgage data
          comment: Computed when gage_contrained == TRUE
          valid_min: -1.0
          valid_max: 2.0
          coverage_content_type: modelResult
      momma/n_bkfl_Qb_prior:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Reach-average flow resistance at bankfull stage
          comment: Computed if input_Qb_prior is available (not NA)
          valid_min: 0.001
          valid_max: 0.3
          coverage_content_type: modelResult
      momma/n_bkfl_slope:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Empirically estimated reach-average flow resistance at bankfull
            stage
          comment: Estimated using the mean of all slope values from SWOT observations
            in the Bray and Davar equation https://il.water.usgs.gov/proj/nvalues/equations.shtml?equation=09-bray1
          valid_min: 0.0
          valid_max: 0.1
          coverage_content_type: modelResult
      momma/vel_bkfl_Qb_prior:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Reach-average discharge velocity at bankfull stage
          comment: Computed if input_Qb_prior is available (not NA)
          units: m/s
          valid_min: 0.0
          valid_max: 10.0
          coverage_content_type: modelResult
      momma/Froude_bkfl_diag_Smean:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Bankfull Froude number derived from mean slope
          comment: The value for the diagnostic Froude number is computed from equation
            (9) found in Bjerklie et al., 2018 (https://doi.org/10.1016/j.jhydrol.2018.04.005)
          valid_min: 0.0
          valid_max: 1.0
          coverage_content_type: modelResult
      momma/width_bkfl_solved_obs:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Estimated bankfull width found from SWOT observations associated
            with the observed  bankfull stage
          comment: the computed bankfull width may not be the highest value in the
            record if an overbank segment is identified or if it is not associated
            with the identified bankfull stage
          units: m
          valid_min: 0.0
          valid_max: 100000.0
          coverage_content_type: modelResult
      momma/depth_bkfl_solved_obs:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: The estimated mean bankfull depth calculated assuming a parabolic
            channel shape
          comment: the relation between the stage and width squared is used to define
            a parabolic channel cross-section shape defining the bottom stage for
            the channel. Alternative cross-section geometry assumptions are possible.
          units: m
          valid_min: 0.0
          valid_max: 100.0
          coverage_content_type: modelResult
      momma/depth_bkfl_diag_Wb_Smean:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Estimated bankfull depth based on the bankfull width and mean
            SWOT-observed slope
          comment: the value for the diagnostic bankfull depth is computed from equation
            (20) found in Bjerklie 2007 (https://doi:10.1016/j.jhydrol.2007.04.011);  is
            used as a diagnostic comparison with MOMMA estimated bankfull depth
          units: m
          valid_min: 0.0
          valid_max: 100.0
          coverage_content_type: modelResult
      momma/zero_flow_stage:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: MOMMA-estimated elevation of zero flow (channel thalweg stage)
          comment: The zero flow stage (elevation of zero flow) is the stage below
            which the algorithm would return zero discharge, and serves as the stage
            defining the reach averaged bottom elevation from which mean depth of
            flow is referenced
          units: m
          valid_min: -100.0
          valid_max: 10000.0
          coverage_content_type: modelResult
      momma/bankfull_stage:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: MOMMA-estimated bankfull stage
          comment: The bankfull stage is used to reference an in-bank and overbank
            segment (if this exists in the observational record) and is used to derive
            relative depths for calculation of the flow resistance in the algorithm.
          units: m
          valid_min: -100.0
          valid_max: 10000.0
          coverage_content_type: modelResult
      momma/Qmean_prior:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Prior estimated mean daily discharge for the reach
          comment: Prior calibration target contained and hosted in the SWORD database;
            same as input_Qm_prior
          units: m^3/s
          valid_min: 0.0
          valid_max: 1000000.0
          coverage_content_type: modelResult
      momma/Qmean_momma:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: MOMMA-estimated mean discharge
          comment: Mean of all discharge estimates for each SWOT observation
          units: m^3/s
          valid_min: 0.0
          valid_max: 1000000.0
          coverage_content_type: modelResult
      momma/Qmean_momma.constrained:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: MOMMA-estimated mean discharge derived from calibration with
            Qgage data
          comment: Computed when gage_contrained == TRUE
          units: m^3/s
          valid_min: 0.0
          valid_max: 1000000.0
          coverage_content_type: modelResult
      momma/width_stage_corr:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: width v. stage correlation coefficient
          comment: Pearson correlation coefficient
          valid_min: 0.0
          valid_max: 1.0
          coverage_content_type: modelResult
      metroman/allq:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: discharge
          comment: discharge of all times, including those outside inversion window
          units: m^3/s
          valid_min: -10000000.0
          valid_max: 10000000.0
          coverage_content_type: modelResult
      metroman/A0hat:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: unobserved cross-sectional area
          comment: represented as the cross-sectional area of the initial time in
            the timeseries
          units: m^2
          valid_min: 0.1
          valid_max: 1000000.0
          coverage_content_type: modelResult
      metroman/nahat:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Manning power law coefficient
          comment: coefficient of the manning's equation power law
          units: m^(1/3)/s
          valid_min: 1.0e-06
          valid_max: 100.0
          coverage_content_type: modelResult
      metroman/x1hat:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Manning power law exponent
          comment: exponent for the manning coefficient power law
          valid_min: -100.0
          valid_max: 100.0
          coverage_content_type: modelResult
      metroman/q_u:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: discharge uncertainty
          comment: uncertainty calculated as the standard deviation of the Markov
            Chain
          units: m^3/s
          valid_min: 1.0e-06
          valid_max: 10000000.0
          coverage_content_type: modelResult
      sic4dvar/A0:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: unobserved cross-sectional area
          comment: unobserved cross-sectional area
          units: m^2
          valid_min: 0.1
          valid_max: 1000000.0
          coverage_content_type: modelResult
      sic4dvar/n:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Manning's roughness coefficient
          comment: Manning's roughness coefficient constant in time
          units: s/m^(1/3)
          valid_min: 1.0e-06
          valid_max: 500.0
          coverage_content_type: modelResult
      sic4dvar/Q_mm:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Computed discharge using optimization of modified Manning's equation
          comment: Discharge time series at reach level using SWOT reach observations
            output of optimization of modified Manning's equation
          units: m^3/s
          valid_min: 0.0
          valid_max: 10000000.0
          coverage_content_type: modelResult
      sic4dvar/Q_da:
        dtype: f8
        dimensions:
        - num_reaches
        required: true
        attrs:
          long_name: Computed discharge using data assimilation
          comment: Discharge time series at node or reach level with improved observations
            output of Bayesian data assimilation
          units: m^3/s
          valid_min: 0.0
          valid_max: 10000000.0
          coverage_content_type: modelResult
      sic4dvar/width:
        dtype: f8
        dimensions:
        - num_nodes
        - nb_pts
        required: true
        attrs:
          long_name: width
          comment: Bed widths at each cross-section (dry observed bathymetry and wet
            estimated bathymetry)
          units: m
          valid_min: 0.1
